version: '3.8'

services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # Pre-pull model on startup
    command: >
      sh -c "ollama serve &
             sleep 10 &&
             ollama pull qwen2.5-coder:1.5b &&
             wait"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_HOST=http://ollama:11434
      - DEEPL_API_KEY=${DEEPL_API_KEY}
      - DJANGO_SETTINGS_MODULE=metriq_site.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LOG_LEVEL=INFO
    volumes:
      - ./config:/app/config:ro
      - ./metrq_dj:/app/metrq_dj:ro
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    deploy:
      replicas: 2  # Scale to 5 for production
    command: celery -A worker.celeryconfig worker --loglevel=${LOG_LEVEL} --concurrency=1 --pool=prefork -Q reports_fast,reports_slow,default,batch,provider

  # Dedicated worker for LLM tasks (GPU-protected)
  worker-llm:
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: >
      celery -A worker worker 
      -Q llm_tasks 
      --concurrency=1 
      --loglevel=info 
      -n llm-worker@%h
    environment:
      - DJANGO_SETTINGS_MODULE=metriq_site.settings
      - OLLAMA_HOST=http://ollama:11434
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
      - ollama
    volumes:
      - ./metrq_dj:/app/metrq_dj
      - ./worker:/app/worker
      - ./modules:/app/modules
      - ./config:/app/config
    # If using GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]


  beat:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=metriq_site.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./config:/app/config:ro
      - ./metrq_dj:/app/metrq_dj:ro
    depends_on:
      - redis
    command: celery -A worker.celeryconfig beat --loglevel=INFO

  db_writer:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - SQLITE_PATH=/data/db.sqlite3
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=metriq_site.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - sqlite_data:/data
      - ./modules:/app/modules:ro
    depends_on:
      - redis
    command: celery -A worker.celeryconfig worker -Q db_writer -P solo

volumes:
  redis_data:
  ollama_data:
  sqlite_data:
