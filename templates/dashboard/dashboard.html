<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetrQ Dashboard</title>
    {% load static %}
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sentiment-positive { color: #059669; }
        .sentiment-negative { color: #dc2626; }
        .sentiment-neutral { color: #6b7280; }
        .article-card { transition: all 0.2s; }
        .article-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
<!-- Header -->
<header class="bg-white shadow-sm border-b">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
        <div class="flex justify-between items-center">
            <div class="flex items-center">
                <h1 class="text-2xl font-bold text-gray-900">MetrQ</h1>
                <span class="ml-2 text-sm text-gray-500">News Analytics</span>
            </div>
            <div class="flex items-center space-x-4">
                <div id="rate-limit-display" class="text-sm text-gray-600">
                    Loading limits...
                </div>
                <span id="user-tier" class="px-3 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                        {{ tier }}
                </span>
                <!-- Upgrade buttons (dynamically shown/hidden) -->
                <div id="upgrade-button-container" class="flex items-center space-x-2">
                    <!-- Will be populated by JavaScript -->
                </div>
                <a href="#" id="logout-link" class="text-sm text-gray-500 hover:text-gray-900">Logout</a>
            </div>
        </div>
    </div>
</header>

<!-- Main Content -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Metrics Section -->
    <section class="mb-8">
        <h2 class="text-lg font-semibold text-gray-900 mb-4">24-Hour Overview</h2>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-white rounded-lg shadow p-6">
                <p class="text-sm text-gray-500 mb-1">Articles Analyzed</p>
                <p id="metric-articles" class="text-3xl font-bold text-gray-900">--</p>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <p class="text-sm text-gray-500 mb-1">Avg Sentiment</p>
                <p id="metric-sentiment" class="text-3xl font-bold sentiment-neutral">--</p>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <p class="text-sm text-gray-500 mb-1">Top Entities</p>
                <div id="metric-entities" class="text-sm text-gray-700 space-y-1">
                    Loading...
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <p class="text-sm text-gray-500 mb-1">Active Languages</p>
                <div id="metric-languages" class="flex space-x-2 mt-2">
                    <span class="px-2 py-1 bg-red-100 text-red-800 text-xs rounded">ZH-CN</span>
                    <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded">ZH-TW</span>
                    <span class="px-2 py-1 bg-green-100 text-green-800 text-xs rounded">EN</span>
                    <span class="px-2 py-1 bg-yellow-100 text-yellow-800 text-xs rounded">RU</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Language Blocks -->
    <section class="mb-8">
        <h2 class="text-lg font-semibold text-gray-900 mb-4">Recent Articles by Language</h2>
        <div id="language-blocks" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Populated by JavaScript -->
        </div>
    </section>

    <!-- Report Generation -->
    <section class="bg-white rounded-lg shadow p-6 mb-8">
        <h2 class="text-lg font-semibold text-gray-900 mb-4">Generate Report</h2>
        <div class="flex flex-wrap gap-4 mb-4">
            <select id="report-type" class="border rounded px-3 py-2">
                <option value="weekly">Weekly Report</option>
                <option value="monthly">Monthly Report</option>
            </select>
            <select id="report-format" class="border rounded px-3 py-2">
                <option value="pdf">PDF (with charts)</option>
                <option value="excel">Excel (with data tables)</option>
            </select>
            <!--  another option is to use global object: onclick="window.MetrQDashboard.requestReport()" instead of: id="generate-report-btn"-->
            <button id="generate-report-btn"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded font-medium transition">
                Generate
            </button>
        </div>
        <div id="report-status" class="hidden">
            <div class="flex items-center space-x-3 mb-2">
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
                </div>
                <span id="progress-text" class="text-sm font-medium w-16">0%</span>
            </div>
            <p id="status-message" class="text-sm text-gray-600">Queued...</p>
        </div>
    </section>

    <!-- Report History -->
    <section>
        <h2 class="text-lg font-semibold text-gray-900 mb-4">Recent Reports</h2>
        <div id="report-history" class="space-y-2">
            <p class="text-gray-500">Loading...</p>
        </div>
    </section>
</main>

<!-- 1. Django config from settings.py -->
<script>
    window.DASHBOARD_CONFIG = {
        API_BASE_URL: '/api',
        REFRESH_INTERVALS: {{ refresh_intervals|safe }}
    };
</script>

<!-- 2. Download dashboard.JS -->
<script src="{% static 'js/dashboard.js' %}"></script>

<!-- 3. Init call -->
<script>
    // Dashboard-specific initialization
    document.addEventListener('DOMContentLoaded', () => {
        window.MetrQDashboard.initDashboard();
    });
</script>
</body>
</html>
